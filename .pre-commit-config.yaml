repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --locked ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format check
        entry: uv run --locked ruff format --check
        language: system
        types: [python]
      - id: mypy
        name: mypy strict
        entry: uv run --locked mypy
        language: system
        pass_filenames: false
        always_run: true
      - id: size-limits
        name: file and function length checks
        entry: uv run --locked python -m scripts.check_lengths
        language: system
        pass_filenames: false
        always_run: true
