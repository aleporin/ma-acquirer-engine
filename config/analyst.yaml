prompt_file: analyst_v8.md
schema_version: rationale-v1
max_tool_rounds: 3
tool_max_rows: 8
# Measured concise drafts peaked at 2,314 output tokens across two complete runs.
max_output_tokens: 4000
# Allow the ranked batch to draft together after the shared-prefix warm-up.
concurrency: 10
# Request safety ceiling; latency_target_seconds remains the run performance gate.
request_timeout_seconds: 120
sdk_retries: 2
# Repair/escalation policy is introduced separately.
output_retries: 0
temperature: null
latency_target_seconds: 60
stability_runs: 5
distinct_ngram_words: 3
max_repairs: 2
escalation_enabled: false
tools_enabled: true
sparse_prompt_file: analyst_sparse_v1.md
sparse_relevant_deals: 3
reviewer_enabled: false
reviewer_prompt_file: reviewer_v1.md
reviewer_max_output_tokens: 2048
max_run_usd: 10.0
request_overhead_tokens: 1024
count_input_tokens: true
token_count_timeout_seconds: 10
run_timeout_seconds: 300
