[project]
name = "ma-acquirer-engine"
version = "0.1.0"
description = "Dataset-grounded acquirer analysis with an offline evaluation harness"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic==2.13.5",
    "PyYAML==6.0.3",
    "structlog==26.1.0",
    "typer==0.27.2",
]

[project.scripts]
acquirers = "acquirer_engine.cli:main"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/acquirer_engine", "evals"]
exclude = ["evals/results/**", "evals/labels/**"]

[dependency-groups]
dev = [
    "mypy==2.3.1",
    "pre-commit==4.6.2",
    "pytest==9.1.1",
    "ruff==0.16.8",
    "types-PyYAML==6.0.12.20260906",
]

[tool.uv]
required-version = "==0.12.17"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "evals", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]
